<nav aria-label="Breadcrumb" class="breadcrumb-default{% if not breadcrumbFlush %} mb-3{% endif %}">
  <ol class="breadcrumb small font-monospace{% if breadcrumbFlush %} mb-0{% endif %}">
    {% if breadcrumbParent %}
      {% for crumb in breadcrumbParent %}
        <li class="breadcrumb-item"><a href="{{ crumb.url }}">{{ crumb.title }}</a></li>
      {% endfor %}
    {% endif %}
    {% if breadcrumbCurrent %}
      <li class="breadcrumb-item active" aria-current="page">{{ breadcrumbCurrent }}</li>
    {% endif %}
  </ol>
</nav>
