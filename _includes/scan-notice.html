<div id="scan-notice" class="alert alert-primary fade show scan-notice small" role="alert">
  <span><i class="fa-solid fa-asterisk"></i> Project ScanGov only scans homepages and general website info key to digital experience. <a href="https://docs.scangov.org/scans/">Learn more.</a></span>
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<script>
(function () {
  var el = document.getElementById('scan-notice');
  if (sessionStorage.getItem('scan-notice-hidden')) {
    el.remove();
    return;
  }
  el.addEventListener('closed.bs.alert', function () {
    sessionStorage.setItem('scan-notice-hidden', '1');
    window.dispatchEvent(new Event('scroll'));
  });
  var footer = document.querySelector('footer');
  function updateNotice() {
    if (el.isConnected && footer) {
      el.style.display = footer.getBoundingClientRect().top < window.innerHeight ? 'none' : '';
    }
  }
  window.addEventListener('scroll', updateNotice);
  updateNotice();
})();
</script>
