<div class="row mt-3">
  <div class="col-12">
    <nav aria-label="Page navigation">
      <ul class="pagination flex-wrap">
        <li class="page-item{% if not pagination.href.previous %} disabled{% endif %}">
          <a class="page-link" href="{{ pagination.href.previous or '#' }}" aria-label="Previous">Previous</a>
        </li>
        {%- for pageEntry in pagination.pages %}
          <li class="page-item{% if page.url == pagination.hrefs[ loop.index0 ] %} active{% endif %}">
            <a class="page-link" href="{{ pagination.hrefs[ loop.index0 ] }}"{% if page.url == pagination.hrefs[ loop.index0 ] %} aria-current="page"{% endif %}>{{ loop.index }}</a>
          </li>
        {%- endfor %}
        <li class="page-item{% if not pagination.href.next %} disabled{% endif %}">
          <a class="page-link" href="{{ pagination.href.next or '#' }}" aria-label="Next">Next</a>
        </li>
      </ul>
    </nav>
  </div>
</div>
