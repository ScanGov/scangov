<style>
  .cta-band {
    position: fixed;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 1030;
    padding: 0.75rem 0;
    background-color: var(--bs-body-bg);
    color: var(--bs-body-color);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
  }

  /* Hidden while the hero or the footer is on screen */
  .cta-band.is-hidden {
    opacity: 0;
    visibility: hidden;
    transform: translateY(100%);
    pointer-events: none;
  }

  .cta-band .btn {
    margin-top: 0;
    margin-bottom: 0;
  }
</style>
<div id="cta-band" class="cta-band border-top" role="region" aria-label="Get ScanGov, see the demo, and share this page">
  <div class="container d-flex align-items-center justify-content-center gap-2">
    <a href="https://scangov.com/plans/" class="btn btn-primary" aria-label="Plans">
      <i class="fa-solid fa-crown" aria-hidden="true"></i><span class="d-none d-md-inline">Plans</span></a>
    <a href="https://scangov.com/demo/" class="btn btn-outline-primary" aria-label="Demo">
      <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i><span class="d-none d-md-inline">Demo</span></a>
    {% if not isTool and not hideCtaCopy %}
    <button type="button" class="btn btn-outline-primary" id="cta-copy-link" aria-label="Copy link">
      <i class="fa-solid fa-link" aria-hidden="true"></i><i class="fa-solid fa-check d-none" aria-hidden="true"></i><span class="d-none d-md-inline">Link</span></button>
    <button type="button" class="btn btn-outline-primary" id="cta-copy-text" aria-label="Copy text">
      <i class="fa-solid fa-copy" aria-hidden="true"></i><i class="fa-solid fa-check d-none" aria-hidden="true"></i><span class="d-none d-md-inline">Text</span></button>
    {% endif %}
    <span class="visually-hidden" role="status" aria-live="polite" id="cta-copy-status"></span>
  </div>
</div>
<script>
  (function() {
    var status = document.getElementById('cta-copy-status');

    // The page link: the canonical link if there is one, else this URL without
    // the query string or hash
    function pageLink() {
      var canonical = document.querySelector('link[rel="canonical"]');
      return canonical && canonical.href ? canonical.href : location.origin + location.pathname;
    }

    // Title, description, and link, ready to paste into email, Teams, Slack, or a post
    function pageText() {
      var h1 = document.querySelector('h1');
      var description = document.querySelector('meta[name="description"]');
      return [
        h1 ? h1.textContent.trim().replace(/\s+/g, ' ') : document.title,
        description ? description.content.trim() : '',
        pageLink()
      ].filter(Boolean).join('\n');
    }

    function wire(buttonId, getText, doneMessage) {
      var button = document.getElementById(buttonId);
      if (!button) return;
      button.addEventListener('click', async function() {
        // Icons are swapped for inline SVGs at build time, so show the hidden
        // check mark instead of changing the icon's class
        var icons = button.querySelectorAll('svg, i');
        var label = button.querySelector('span');
        var labelText = label.textContent;
        try {
          await navigator.clipboard.writeText(getText());
          icons[0].classList.add('d-none');
          icons[1].classList.remove('d-none');
          label.textContent = 'Copied';
          status.textContent = doneMessage;
          setTimeout(function() {
            icons[0].classList.remove('d-none');
            icons[1].classList.add('d-none');
            label.textContent = labelText;
            status.textContent = '';
          }, 2000);
        } catch (err) {
          // Clipboard unavailable: leave the button as it is
        }
      });
    }

    // Show the band only between the hero and the footer. This script sits above
    // the footer in the page, so wait until the whole page is parsed.
    function watchHeroAndFooter() {
      var band = document.getElementById('cta-band');
      var h1 = document.querySelector('h1');
      var targets = [h1 ? (h1.closest('.pt-5') || h1) : null, document.querySelector('footer')].filter(Boolean);
      if (!band || !targets.length || !('IntersectionObserver' in window)) return;
      var inView = new Map();
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) { inView.set(entry.target, entry.isIntersecting); });
        band.classList.toggle('is-hidden', Array.from(inView.values()).some(Boolean));
      });
      targets.forEach(function(target) { observer.observe(target); });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', watchHeroAndFooter);
    } else {
      watchHeroAndFooter();
    }

    wire('cta-copy-link', pageLink, 'Link copied');
    wire('cta-copy-text', pageText, 'Text copied');
  })();
</script>
