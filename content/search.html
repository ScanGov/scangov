---
home: false
layout: layouts/default
title: Search
description: Search domains tracked by ScanGov.
keywords: government domains, government websites
hideDescription: true
search: true
---

<div class="col-12 d-none" id="results-section">
    <p class="mt-3 mb-0" id="results-count" role="status" aria-live="polite"></p>
    <div class="table-responsive">
        <table class="table mt-3">
            <caption class="visually-hidden">Search results</caption>
            <thead>
                <tr>
                    <th scope="col" style="width: 85%;">Domain</th>
                    <th scope="col" class="text-center">Grade</th>
                </tr>
            </thead>
            <tbody id="results-table"></tbody>
        </table>
    </div>
</div>
<div class="col-12 d-none" id="no-results-alert">
    <div class="alert alert-info mt-3" role="alert">
        <i class="fa-solid fa-not-equal"></i> We're not currently scanning that domain.
    </div>
</div>
<script>
    (function () {
        const CSV_URL = '/data/search.csv';
        // The type-ahead stays short; the table below is the unabridged list.
        const DROPDOWN_LIMIT = 10;

        const searchInput = document.getElementById('search-input');
        const dropdown = document.getElementById('search-results');
        const resultsSection = document.getElementById('results-section');
        const resultsTable = document.getElementById('results-table');
        const resultsCount = document.getElementById('results-count');
        const noResults = document.getElementById('no-results-alert');

        const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        const profileUrl = (domain) => '/profile/' + domain.replaceAll('.', '-') + '/overall/';
        const agencyUrl = (agency) => '/search/?search=' + encodeURIComponent(agency);

        function letterGrade(score) {
            if (score >= 90) return 'A';
            if (score >= 80) return 'B';
            if (score >= 70) return 'C';
            if (score >= 60) return 'D';
            return 'F';
        }

        // Mirrors gradeColor() in eleventy.config.js, including the inaccessible
        // bucket that shares the state map legend's --bs-inaccessible gray.
        function gradeClass(score) {
            if (score >= 90) return 'success';
            if (score >= 70) return 'warning';
            if (score >= 0) return 'danger';
            return 'inaccessible';
        }

        // Rows are domain,"agency",score,status. Older builds emitted only
        // domain,"agency", so the trailing columns stay optional. Agency is quoted
        // because 3k+ names contain a comma.
        function parseRow(line) {
            const row = line.trim();
            const firstComma = row.indexOf(',');
            if (firstComma < 0) return null;

            const domain = row.slice(0, firstComma);
            const rest = row.slice(firstComma + 1);
            const toNumber = (value) => (value === '' ? null : Number(value));
            const unquote = (value) => value.replaceAll('""', '"');

            const withScores = rest.match(/^"(.*)",([^,"]*),([^,"]*)$/);
            if (withScores) {
                return {
                    domain,
                    agency: unquote(withScores[1]),
                    score: toNumber(withScores[2]),
                    status: toNumber(withScores[3])
                };
            }

            const quoted = rest.match(/^"(.*)"$/);
            return { domain, agency: quoted ? unquote(quoted[1]) : rest, score: null, status: null };
        }

        // Exact domain first, then domain prefix, then domain substring, then
        // agency-only matches. Without this a query like "ca.gov" buries ca.gov
        // itself behind the 48 other domains whose names merely contain it.
        function rank(row, query) {
            const domain = row.domain.toLowerCase();
            if (domain === query) return 0;
            if (domain.startsWith(query)) return 1;
            if (domain.includes(query)) return 2;
            if (row.agency.toLowerCase().includes(query)) return 3;
            return -1;
        }

        function search(rows, query) {
            const needle = query.trim().toLowerCase();
            if (!needle) return [];
            return rows
                .map((row) => ({ row, tier: rank(row, needle) }))
                .filter((match) => match.tier >= 0)
                .sort((a, b) => a.tier - b.tier || a.row.domain.localeCompare(b.row.domain))
                .map((match) => match.row);
        }

        function gradeBadge(row) {
            if (row.status !== 200 || row.score === null) {
                return '<span class="badge text-bg-inaccessible" title="Inaccessible / no data">n/a</span>';
            }
            return '<span class="badge text-bg-' + gradeClass(row.score) + '" title="' + row.score + '%">'
                + letterGrade(row.score) + '</span>';
        }

        function renderTable(matches, query) {
            resultsTable.innerHTML = matches.map((row) => '<tr>'
                + '<td><a href="' + profileUrl(row.domain) + '">' + escapeHtml(row.domain) + '</a><br>'
                + '<a class="small text-muted" href="' + agencyUrl(row.agency) + '">'
                + escapeHtml(row.agency) + '</a></td>'
                + '<td class="text-center grade-display-column">' + gradeBadge(row) + '</td>'
                + '</tr>').join('');

            resultsCount.textContent = matches.length + (matches.length === 1 ? ' result for ' : ' results for ')
                + '"' + query + '"';
            resultsSection.classList.toggle('d-none', matches.length === 0);
            noResults.classList.toggle('d-none', matches.length > 0);
        }

        function renderDropdown(matches) {
            dropdown.innerHTML = matches.slice(0, DROPDOWN_LIMIT).map((row) => '<div class="border-list-item">'
                + '<a href="' + profileUrl(row.domain) + '">' + escapeHtml(row.domain) + '</a><br>'
                + '<span class="small text-muted">' + escapeHtml(row.agency) + '</span>'
                + '</div>').join('');
        }

        fetch(CSV_URL)
            .then((res) => res.text())
            .then((text) => {
                const rows = text.split('\n').slice(1).map(parseRow).filter(Boolean);

                searchInput.addEventListener('input', () => renderDropdown(search(rows, searchInput.value)));

                // Render the full, uncapped table for ?search=, so a results view is
                // linkable and the exact match is never pushed off the end.
                const query = new URLSearchParams(window.location.search).get('search');
                if (query && query.trim()) {
                    searchInput.value = query;
                    renderTable(search(rows, query), query);
                }
            })
            .catch((error) => console.error('search: ' + error.message));

        // No submit handler on purpose. The form's default GET to /search/ is what
        // produces the shareable ?search= URL; the previous handler preventDefault'd
        // and jumped to the first type-ahead hit, so the results table was
        // unreachable and the query string was never honoured.
    })();
</script>
