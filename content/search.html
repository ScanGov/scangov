---
home: false
layout: layouts/default
title: Search
description: Search domains tracked by ScanGov.
keywords: government domains, government websites
search: true
---

<div class="col-12 d-none" id="results-section">
    <div class="table-responsive">
        <table class="table mt-3">
            <caption class="visually-hidden">Search results</caption>
            <thead>
                <tr>
                    <th scope="col" style="width: 85%;">Domain</th>
                    <th scope="col" class="text-center">Grade</th>
                </tr>
            </thead>
            <tbody id="results-table"></tbody>
        </table>
    </div>
</div>
<div class="col-12 d-none" id="no-results-alert">
    <div class="alert alert-info mt-3" role="alert">
        <i class="fa-solid fa-not-equal"></i> We're not currently scanning that domain.
    </div>
</div>
<script>
    const resultsDiv = document.getElementById('search-results');

    fetch('/data/search.csv').then(res => res.text()).then(data => {
        data = data.split('\n').map(d => {
            const separator = d.indexOf(',');
            return [d.substring(0, separator), d.substring(separator + 2, d.length - 1) /* remove quotes */];
        });
        data.shift();

        const searchResults = [];
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', () => {
            // List up to first 10 matching results
            let count = 0;
            const query = searchInput.value.toLowerCase();
            console.log(query)
            if (query)
                for (const domain of data) {
                    if (domain[0].toLowerCase().includes(query) || domain[1].toLowerCase().includes(query)) {
                        searchResults.push(domain);

                        count++;
                        if (count >= 10)
                            break;
                    }
                }

            // Remove elements that are no longer in results
            let length = resultsDiv.childElementCount;
            elementLoop: for (let i = 0; i < length; i++) {
                const resultElement = resultsDiv.children[i];

                const urlkey = resultElement.getAttribute('data-domain');
                for (let j = 0; j < searchResults.length; j++) {
                    if (urlkey === searchResults[j][0]) {
                        searchResults.splice(j, 1);
                        continue elementLoop;
                    }
                }

                resultsDiv.removeChild(resultElement);
                // Adjust count because list changed
                i--;
                length--;
            }

            // Add remaining results
            length = searchResults.length;
            for (let i = 0; i < length; i++) {
                const domain = searchResults[0];

                const resultElement = document.createElement('div');
                resultElement.setAttribute('data-domain', domain[0]);
                resultElement.classList.add('border-list-item');
                resultElement.innerHTML = `
                    <a href="/profile/${domain[0].replaceAll('.', '-')}/overall/">${domain[0]}</a>
                    <br>
                    <a class="small text-muted" href="/org/${domain[1].toLowerCase().replaceAll(/( |,)+/g, '-')}/">${domain[1]}</a>
                `;
                resultsDiv.appendChild(resultElement);

                searchResults.splice(0, 1);
            }
        });
    });

    // Handle form submit
    document.getElementById('search-form').addEventListener('submit', e => {
        e.preventDefault();

        const firstResult = resultsDiv.children[0];
        if (!firstResult)
            return;

        location.href = '/profile/' + firstResult.getAttribute('data-domain').replaceAll('.', '-') + '/overall/';
    });
